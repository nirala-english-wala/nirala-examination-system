  header { text-align: center; color: #fff; margin-bottom: 16px; }
  header h1 { margin: 0; font-size: 1.5em; }
  header p { opacity: 0.85; margin: 4px 0 0; font-size: 0.85em; }
  .card { background: #fff; border-radius: 10px; padding: 22px; margin-bottom: 14px; box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
  input { padding: 10px; margin: 6px 0 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; width: 100%; -webkit-user-select: text; user-select: text; }
  label { display: block; font-weight: bold; color: #1a3d6d; font-size: 0.9em; }
  button { padding: 12px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; }
  .btn-primary { background: #1a3d6d; color: #fff; width: 100%; }
  .qcard { background: #fff; border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
  .qnum { font-weight: bold; color: #1a3d6d; margin-bottom: 6px; }
  .qprogress { text-align:center; color:#fff; opacity:0.85; font-size:0.85em; margin-bottom:6px; }
  .opt-label {
    display: block; padding: 8px 10px; margin: 6px 0; border: 1px solid #ddd; border-radius: 6px; cursor: pointer;
  }
  .opt-label.selected { background: #e3f0fa; border-color: #1a3d6d; }
  .opt-label input { display: none; }

  <button class="btn-primary" id="nextBtn" style="display:none;">Next Question →</button>
  <button class="btn-primary" id="submitBtn" style="display:none;">Submit Test</button>

  <div id="resultScreen" class="card" style="display:none;">
    <div class="center-msg">
      <h2>Result</h2>
      <div id="scoreText" style="font-size:2em; font-weight:bold; color:#1a3d6d;"></div>
      <p id="remarkText"></p>
    </div>
  </div>
</div>

<div id="violationWarn">
  ⚠️ <span id="violationMsg"></span>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs,
  serverTimestamp, arrayUnion, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYmRr2jaXJayWfH59J2vG1eRfq231QlFk",
  authDomain: "nirala-english-wala.firebaseapp.com",
  projectId: "nirala-english-wala",
  storageBucket: "nirala-english-wala.firebasestorage.app",
  messagingSenderId: "272386406767",
  appId: "1:272386406767:web:00712880f0aa5039dc509a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Enable offline support: answers keep working and get queued automatically
// if the student's network drops, then sync once it's back.
enableIndexedDbPersistence(db).catch(() => {
  // fails silently if multiple tabs are open or browser doesn't support it —
  // the test still works, just without offline queuing in that edge case
});

let studentCode = '';
let testId = '';
let questions = [];
let answers = [];
let questionTimes = [];
let perQuestionEnabled = false;
let instantFeedbackEnabled = false;
let answerKeyMap = {}; // only populated when the admin has turned on Instant Feedback for this test
let currentQIndex = 0;
let qTimerInterval = null;
let globalTimerInterval = null;
let violations = 0;
let testSubmitted = false;

async function getServerTime() {
  const ref = doc(db, 'meta', 'clock');
  await setDoc(ref, { t: serverTimestamp() });
  const snap = await getDoc(ref);
  return snap.data().t.toDate();
}

// Fisher-Yates shuffle so each student gets questions in a different order
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

document.getElementById('checkCodeBtn').addEventListener('click', async () => {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const errEl = document.getElementById('codeError');
  errEl.style.display = 'none';
  if (!code) return;

  try {
    const ref = doc(db, 'attempts', code);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      errEl.textContent = 'This code is not valid. Please check again.';
      errEl.style.display = 'block';
      return;
    }
    const data = snap.data();
    if (data.used) {
      errEl.textContent = 'This code has already been used. Each code works only once.';
      errEl.style.display = 'block';
      return;
    }
    studentCode = code;
    testId = data.testId;
    document.getElementById('codeScreen').style.display = 'none';
    document.getElementById('confirmScreen').style.display = 'block';
    document.getElementById('confirmName').textContent = data.name;
    document.getElementById('confirmDetails').textContent = `Class: ${data.class} | Roll: ${data.roll}`;
  } catch (e) {
    errEl.textContent = 'Please check your internet, a connection issue occurred.';
    errEl.style.display = 'block';
  }
});

document.getElementById('confirmYesBtn').addEventListener('click', async () => {
  document.getElementById('confirmScreen').style.display = 'none';
  await checkTimeWindowAndStart();
});

async function checkTimeWindowAndStart() {
  let testSnap, now;
  try {
    testSnap = await getDoc(doc(db, 'tests', testId));
    now = await getServerTime();
  } catch (e) {
    showWait('Connection is slow or unavailable. Please check your internet and try again.');
    showRetryButton();
    return;
  }

  if (!testSnap.exists()) {
    showWait('This test could not be found. Please ask the admin.');
    return;
  }
  const cfg = testSnap.data();
  document.getElementById('testTitleTag').textContent = cfg.title || 'Online Test';

  const startDT = new Date(`${cfg.date}T${cfg.startTime}:00`);
  const endDT = new Date(`${cfg.date}T${cfg.endTime}:00`);
  const lateCutoffMin = (cfg.lateCutoffMinutes !== undefined) ? cfg.lateCutoffMinutes : 2;
  const cutoffDT = new Date(startDT.getTime() + lateCutoffMin * 60000);

  if (now < startDT) {
    showWait(`Test will start on ${cfg.date} at ${cfg.startTime}. Please wait.`);
    return;
  }
  if (now > endDT) {
    showWait('The test time has ended. You can no longer take the test.');
    return;
  }
  if (now > cutoffDT) {
    document.getElementById('waitTitle').textContent = '🚫 Late Entry';
    showWait(`The test started at ${cfg.startTime}. The allowed login window (${lateCutoffMin} min) has passed — entry is no longer allowed.`);
    return;
  }

  // fire-and-forget: don't block test start on a slow/queued network write
  updateDoc(doc(db, 'attempts', studentCode), { status: 'in_progress', startedAt: Date.now() }).catch(() => {});

  // time left is based on the actual clock end time, not a fixed duration —
  // so a student who joins a few minutes late still ends exactly on time
  const secondsRemaining = Math.max(30, Math.floor((endDT - now) / 1000));
  document.getElementById('endsAtTag').textContent = 'Test ends at ' + cfg.endTime;
  document.getElementById('endsAtTag').style.display = 'block';

  perQuestionEnabled = !!cfg.perQuestionTimerEnabled;
  instantFeedbackEnabled = !!cfg.instantFeedbackEnabled;
  await loadQuestionsAndStart(secondsRemaining);
}

function showWait(msg) {
  document.getElementById('waitScreen').style.display = 'block';
  document.getElementById('waitMsg').textContent = msg;
}

function showRetryButton() {
  const btn = document.getElementById('retryBtn');
  btn.style.display = 'block';
  btn.onclick = () => {
    document.getElementById('waitScreen').style.display = 'none';
    btn.style.display = 'none';
    checkTimeWindowAndStart();
  };
}

async function loadQuestionsAndStart(totalSeconds) {
  const qSnap = await getDocs(collection(db, 'tests', testId, 'questions'));
  let loaded = [];
  qSnap.forEach(d => loaded.push({ id: d.id, ...d.data() }));

  if (!loaded.length) {
    showWait('No questions have been added yet. Please ask the admin.');
    return;
  }

  questions = shuffle(loaded); // each student gets a different question order

  answerKeyMap = {};
  if (instantFeedbackEnabled) {
    // Only fetched when the admin has explicitly opted into Instant Feedback
    // for this test — otherwise correct answers never reach the student's device.
    const akSnap = await getDocs(collection(db, 'tests', testId, 'answerKeys'));
    akSnap.forEach(d => { answerKeyMap[d.id] = d.data().correct; });
  }

  answers = new Array(questions.length).fill(-1);
  setupSecurity();
  requestFullscreenSafe();

  if (perQuestionEnabled) {
    const base = Math.floor(totalSeconds / questions.length);
    const remainder = totalSeconds - base * questions.length;
    questionTimes = questions.map((_, i) => base + (i < remainder ? 1 : 0));
    document.getElementById('qprogress').style.display = 'block';
    document.getElementById('nextBtn').style.display = 'block';
    document.getElementById('nextBtn').addEventListener('click', () => advanceQuestion());
    currentQIndex = 0;
    renderQuestion(0);
    startQuestionTimer(0);
  } else {
    renderAllQuestions();
    document.getElementById('submitBtn').style.display = 'block';
    document.getElementById('submitBtn').addEventListener('click', () => submitTest(false));
    startGlobalTimer(totalSeconds);
  }
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function renderAllQuestions() {
  const quizDiv = document.getElementById('quiz');
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    let optsHtml = '';
    q.opts.forEach((opt, j) => {
      optsHtml += `<label class="opt-label" id="q${i}_l${j}">
        <input type="radio" name="q${i}" value="${j}" onchange="window.selectOpt(${i},${j})">
        ${String.fromCharCode(65+j)}) ${esc(opt)}
      </label>`;
    });
    card.innerHTML = `<div class="qnum">Q${i+1}. ${esc(q.text)}</div>${optsHtml}`;
    quizDiv.appendChild(card);
  });
}

function renderQuestion(i) {
  const q = questions[i];
  document.getElementById('qprogress').textContent = `Question ${i+1} / ${questions.length}`;
  const quizDiv = document.getElementById('quiz');
  let optsHtml = '';
  q.opts.forEach((opt, j) => {
    optsHtml += `<label class="opt-label" id="opt_l${j}">
      <input type="radio" name="currentQ" value="${j}" onchange="window.selectCurrentOpt(${j})">
      ${String.fromCharCode(65+j)}) ${esc(opt)}
    </label>`;
  });
  quizDiv.innerHTML = `<div class="qcard"><div class="qnum">Q${i+1}. ${esc(q.text)}</div>${optsHtml}</div>`;
}

function showInstantFeedback(cardEl, q, selectedIdx) {
  if (!instantFeedbackEnabled) return;
  const correct = answerKeyMap[q.id];
  if (correct === undefined) return;
  const isCorrect = selectedIdx === correct;
  const msg = document.createElement('div');
  msg.style.marginTop = '8px';
  msg.style.padding = '8px 10px';
  msg.style.borderRadius = '6px';
  msg.style.fontWeight = 'bold';
  if (isCorrect) {
    msg.style.background = '#e8f5e9';
    msg.style.color = '#2e7d32';
    msg.textContent = '✅ Correct!';
  } else {
    msg.style.background = '#ffebee';
    msg.style.color = '#c62828';
    msg.textContent = `❌ Wrong! Correct answer: ${String.fromCharCode(65+correct)}) ${q.opts[correct]}`;
  }
  cardEl.appendChild(msg);
}

window.selectCurrentOpt = function(j) {
  answers[currentQIndex] = j;
  document.querySelectorAll('#quiz input[name="currentQ"]').forEach(r => r.disabled = true);
  document.querySelectorAll('#quiz .opt-label').forEach(l => l.classList.remove('selected'));
  document.getElementById('opt_l'+j).classList.add('selected');
  showInstantFeedback(document.querySelector('#quiz .qcard'), questions[currentQIndex], j);
};

window.selectOpt = function(i, j) {
  document.querySelectorAll(`input[name="q${i}"]`).forEach(r => r.disabled = true);
  document.getElementById(`q${i}_l${j}`).classList.add('selected');
  showInstantFeedback(document.getElementById(`q${i}_l${j}`).closest('.qcard'), questions[i], j);
};

function startQuestionTimer(idx) {
  let remaining = questionTimes[idx];
  const box = document.getElementById('timerBox');
  box.style.display = 'block';
  update();
  qTimerInterval = setInterval(() => {
    remaining--;
    update();
    if (remaining <= 0) { clearInterval(qTimerInterval); advanceQuestion(); }
  }, 1000);
  function update() {
    const m = Math.floor(remaining/60).toString().padStart(2,'0');
    const s = (remaining%60).toString().padStart(2,'0');
    document.getElementById('timerText').textContent = m+':'+s;
    box.classList.toggle('warn', remaining <= 5);
  }
}

function advanceQuestion() {
  if (qTimerInterval) clearInterval(qTimerInterval);
  currentQIndex++;
  if (currentQIndex >= questions.length) { submitTest(false); return; }
  renderQuestion(currentQIndex);
  startQuestionTimer(currentQIndex);
}

function startGlobalTimer(seconds) {
  let remaining = seconds;
  const box = document.getElementById('timerBox');
  box.style.display = 'block';
  update();
  globalTimerInterval = setInterval(() => {
    remaining--;
    update();
    if (remaining <= 0) { clearInterval(globalTimerInterval); submitTest(false); }
  }, 1000);
  function update() {
    const m = Math.floor(remaining/60).toString().padStart(2,'0');
    const s = (remaining%60).toString().padStart(2,'0');
    document.getElementById('timerText').textContent = m+':'+s;
    box.classList.toggle('warn', remaining <= 60);
  }
}

function requestFullscreenSafe() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

function setupSecurity() {
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('copy', e => e.preventDefault());
  document.addEventListener('cut', e => e.preventDefault());
  document.addEventListener('visibilitychange', handleVisibilityChange);
  window.addEventListener('blur', handleVisibilityChange);
  document.addEventListener('fullscreenchange', handleFullscreenChange);
  document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
}

const MAX_WARNINGS = 1;

function registerViolation(reason) {
  if (testSubmitted) return;
  violations++;

  // log the reason so the admin can see exactly what happened, not just a count
  updateDoc(doc(db, 'attempts', studentCode), {
    violationLog: arrayUnion({ reason, at: Date.now() })
  }).catch(() => {});

  if (violations <= MAX_WARNINGS) {
    showViolationWarning(`Warning ${violations}/${MAX_WARNINGS}: ${reason} Do not repeat this, or the test will be cancelled.`);
  } else {
    showViolationWarning('Test is being cancelled — allowed warnings exceeded.');
    setTimeout(() => submitTest(true), 1500);
  }
}

function handleVisibilityChange() {
  if (testSubmitted) return;
  if (document.hidden) registerViolation('You switched away from the test screen.');
}

function handleFullscreenChange() {
  if (testSubmitted) return;
  const inFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
  if (!inFullscreen) {
    registerViolation('You exited fullscreen mode.');
    requestFullscreenSafe();
  }
}

function showViolationWarning(msg) {
  const el = document.getElementById('violationWarn');
  document.getElementById('violationMsg').textContent = msg;
  el.style.display = 'block';
  clearTimeout(window._violationHideTimer);
  window._violationHideTimer = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

async function submitTest(flagged) {
  if (testSubmitted) return;
  testSubmitted = true;
  if (qTimerInterval) clearInterval(qTimerInterval);
  if (globalTimerInterval) clearInterval(globalTimerInterval);
  if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});

  // NOTE: we deliberately do NOT compute a score here. Correct answers are
  // never sent to the student's device (they live in an admin-only
  // "answerKeys" collection), so grading happens later on the admin side
  // using these raw selections.
  const studentAnswers = [];
  if (perQuestionEnabled) {
    questions.forEach((q, i) => {
      studentAnswers.push({ questionId: q.id, selected: answers[i] });
    });
  } else {
    questions.forEach((q, i) => {
      const sel = document.querySelector(`input[name="q${i}"]:checked`);
      const selected = sel ? parseInt(sel.value) : -1;
      studentAnswers.push({ questionId: q.id, selected });
    });
  }

  document.getElementById('quiz').style.display = 'none';
  document.getElementById('qprogress').style.display = 'none';
  document.getElementById('endsAtTag').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('timerBox').style.display = 'none';

  const status = flagged ? 'flagged_out' : 'completed';

  // fire-and-forget: on a slow/dropped connection this gets queued locally
  // (offline persistence) and syncs automatically once network is back —
  // the student doesn't have to wait or worry about it
  updateDoc(doc(db, 'attempts', studentCode), {
    used: true, status, studentAnswers, violations, completedAt: Date.now()
  }).catch(() => {});

  document.getElementById('resultScreen').style.display = 'block';
  if (flagged) {
    document.getElementById('scoreText').textContent = '🚩 Test Ended';
    document.getElementById('remarkText').textContent = 'Your test was ended due to a security violation. Please contact your admin.';
  } else {
    document.getElementById('scoreText').textContent = '✅ Test Submitted';
    document.getElementById('remarkText').textContent = 'Your test has been submitted successfully. Your marksheet will be sent to you shortly.';
  }
}
</script>
</body>
</html>
