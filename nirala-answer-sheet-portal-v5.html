<style>

    .container { max-width: 900px; }

  .btn-primary { background: #1a3d6d; color: #fff; }
  .btn-secondary { background: #607d8b; color: #fff; }
  .center-msg { text-align: center; padding: 10px; }

  <div id="formScreen" class="card">
    <h2 style="color:#1a3d6d; margin-top:0; text-align:center;">Get Your Answer Sheet</h2>
    <label>Access Code (the one you used for the test)</label>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYmRr2jaXJayWfH59J2vG1eRfq231QlFk",
  authDomain: "nirala-english-wala.firebaseapp.com",
  projectId: "nirala-english-wala",
  storageBucket: "nirala-english-wala.firebasestorage.app",
  messagingSenderId: "272386406767",
  appId: "1:272386406767:web:00712880f0aa5039dc509a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Embedded font supporting Latin + Devanagari (Hindi) + Greek + math symbols,
// so PDF answer sheets render Hindi/Greek/math correctly.

let currentAttempt = null;

function showScreen(id) {
  ['formScreen', 'statusScreen', 'readyScreen'].forEach(s => {
    document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
  });
}

function showStatus(title, msg) {
  document.getElementById('statusTitle').textContent = title;
  document.getElementById('statusMsg').textContent = msg;
  showScreen('statusScreen');
}

document.getElementById('backBtn').addEventListener('click', () => showScreen('formScreen'));
document.getElementById('backBtn2').addEventListener('click', () => showScreen('formScreen'));

document.getElementById('checkBtn').addEventListener('click', async () => {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim().toLowerCase();
  const roll = document.getElementById('rollInput').value.trim().toLowerCase();
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';
  if (!code || !name || !roll) return;

  try {
    const attemptSnap = await getDoc(doc(db, 'attempts', code));
    if (!attemptSnap.exists()) {
      errEl.textContent = 'This code is not valid.';
      errEl.style.display = 'block';
      return;
    }
    const attempt = { id: attemptSnap.id, ...attemptSnap.data() };

    if (attempt.name.trim().toLowerCase() !== name || attempt.roll.trim().toLowerCase() !== roll) {
      errEl.textContent = 'Name or roll number does not match this code.';
      errEl.style.display = 'block';
      return;
    }
    if (!attempt.used) {
      showStatus('⏳ Test Not Completed Yet', 'This code has not been used to complete a test yet.');
      return;
    }

    const testSnap = await getDoc(doc(db, 'tests', attempt.testId));
    const test = testSnap.exists() ? testSnap.data() : {};

    if (!test.resultsReleased) {
      showStatus('🔒 Not Released Yet', 'Your admin has not released answer sheets for this test yet. Please check back later.');
      return;
    }

    currentAttempt = attempt;
    currentAttempt.testTitle = test.title || currentAttempt.testTitle;
    document.getElementById('readyInfo').textContent = `${attempt.name} — ${currentAttempt.testTitle}`;
    showScreen('readyScreen');
  } catch (e) {
    errEl.textContent = 'Connection issue — please check your internet and try again.';
    errEl.style.display = 'block';
  }
});

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// Renders an offscreen HTML div (using the browser's own — already correct —
// text shaping for Hindi/Devanagari) to a canvas, then slices that canvas
// across as many A4 pages as needed inside a jsPDF document.
async function htmlToPdf(containerEl) {
  const canvas = await html2canvas(containerEl, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pageWidthMm = 210, pageHeightMm = 297;
  const pxPerMm = canvas.width / pageWidthMm;
  const pageHeightPx = Math.floor(pageHeightMm * pxPerMm);

  let renderedPx = 0;
  let firstPage = true;
  while (renderedPx < canvas.height) {
    const sliceHeightPx = Math.min(pageHeightPx, canvas.height - renderedPx);
    const pageCanvas = document.createElement('canvas');
    pageCanvas.width = canvas.width;
    pageCanvas.height = sliceHeightPx;
    pageCanvas.getContext('2d').drawImage(
      canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx
    );
    const imgData = pageCanvas.toDataURL('image/jpeg', 0.92);
    if (!firstPage) pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, 0, pageWidthMm, sliceHeightPx / pxPerMm);
    renderedPx += sliceHeightPx;
    firstPage = false;
  }
  return pdf;
}

async function buildAnswerSheetPDF() {
  const attempt = currentAttempt;
  const [qSnap, akSnap] = await Promise.all([
    getDocs(collection(db, 'tests', attempt.testId, 'questions')),
    getDocs(collection(db, 'tests', attempt.testId, 'answerKeys'))
  ]);
  const qMap = {};
  qSnap.forEach(d => { qMap[d.id] = d.data(); });
  const akMap = {};
  akSnap.forEach(d => { akMap[d.id] = d.data().correct; });

  const answerDetails = (attempt.studentAnswers || []).map(a => {
    const q = qMap[a.questionId] || { text: '(question removed)', opts: ['', '', '', ''] };
    return { text: q.text, opts: q.opts, correct: akMap[a.questionId], selected: a.selected };
  });
  const score = answerDetails.filter(d => d.selected === d.correct).length;
  const total = answerDetails.length;
  const pct = total ? Math.round((score / total) * 100) : 0;
  const remark = pct >= 90 ? 'Excellent!' : pct >= 70 ? 'Good job!' : pct >= 50 ? 'Not bad!' : 'Keep practicing!';

  const qHtml = answerDetails.map((q, i) => {
    const isCorrect = q.selected === q.correct;
    const selText = q.selected >= 0 ? `${String.fromCharCode(65+q.selected)}) ${esc(q.opts[q.selected])}` : 'Not answered';
    const correctText = `${String.fromCharCode(65+q.correct)}) ${esc(q.opts[q.correct])}`;
    return `
      <div style="margin-bottom:12px;">
        <div style="font-weight:bold; margin-bottom:3px;">Q${i+1}. ${esc(q.text)}</div>
        <div style="color:${isCorrect ? '#0a8a3c' : '#c62828'};">Your answer: ${selText} ${isCorrect ? '(Correct)' : '(Wrong)'}</div>
        ${!isCorrect ? `<div style="color:#0a6428;">Correct answer: ${correctText}</div>` : ''}
      </div>`;
  }).join('');

  const html = `
    <div style="font-family: Arial, 'Noto Sans Devanagari', sans-serif; width:720px; padding:24px; color:#111; background:#fff; font-size:13px; line-height:1.5;">
      <h2 style="text-align:center; margin:0 0 2px;">Nirala English Wala</h2>
      <p style="text-align:center; margin:0 0 16px;">Answer Sheet — ${esc(attempt.testTitle || '')}</p>
      <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
        <span>Name: ${esc(attempt.name)}</span><span>Class/Roll: ${esc(attempt.class)} / ${esc(attempt.roll)}</span>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
        <span>Score: ${score} / ${total} (${pct}%)</span><span>Remark: ${remark}</span>
      </div>
      ${qHtml}
    </div>`;

  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-9999px';
  container.style.top = '0';
  container.innerHTML = html;
  document.body.appendChild(container);
  try {
    const pdf = await htmlToPdf(container);
    return pdf;
  } finally {
    document.body.removeChild(container);
  }
}

document.getElementById('viewBtn').addEventListener('click', async () => {
  const pdf = await buildAnswerSheetPDF();
  window.open(pdf.output('bloburl'), '_blank');
});

document.getElementById('downloadBtn').addEventListener('click', async () => {
  const pdf = await buildAnswerSheetPDF();
  pdf.save(`AnswerSheet-${currentAttempt.name}-${currentAttempt.roll}.pdf`);
});
</script>
